[package]
name = "image-resizing-lambda"
version = "0.1.0"
edition = "2024"

[dependencies]
# Lambda runtime (latest: 1.0.1)
lambda_runtime = "1.0.1"
aws_lambda_events = { version = "1.0.1", default-features = false, features = ["s3"] }

# AWS SDK (latest as of 2025-11-17)
aws-config = { version = "1.8.11", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.115.0"
aws-sdk-dynamodb = "1.100.0"

# Image processing (latest: 0.25.9)
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png"] }

# Async runtime (latest: 1.48.0)
tokio = { version = "1.48.0", features = ["macros"] }

# Logging (latest: tracing 0.1.41, tracing-subscriber 0.3.20)
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

# Error handling (latest: thiserror 2.0.17, anyhow 1.0.100)
thiserror = "2.0.17"
anyhow = "1.0.100"

# Serialization (latest: serde 1.0.228, serde_json 1.0.145)
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Time handling (latest: 0.4.42)
chrono = "0.4.42"

# URL decoding (latest: 2.1.3)
urlencoding = "2.1.3"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
